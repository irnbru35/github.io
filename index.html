<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Kimi Kirei Avo Mania</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --cream:#fff7df;--green:#2f6f22;--lime:#bde86a;--pink:#ff6f9f;--yellow:#ffe066;
  --brown:#7b4a22;--dark:#12320f;--glass:rgba(255,255,255,.78);
}
body{
  margin:0;min-height:100vh;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--dark);
  background:
    radial-gradient(circle at 20% 12%,rgba(255,255,255,.9),transparent 22%),
    radial-gradient(circle at 85% 80%,rgba(189,232,106,.45),transparent 25%),
    linear-gradient(135deg,#fff2cf,#d9f5a7,#fff7df);
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:url("Kimi.jpeg") center/cover no-repeat;
  opacity:.16;filter:saturate(1.05);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;
  background-image:
    radial-gradient(circle,#7dbb42 0 7px,transparent 8px),
    radial-gradient(circle,#f4c36b 0 5px,transparent 6px);
  background-size:90px 90px,130px 130px;
  background-position:0 0,40px 20px;
  opacity:.13;
}
button{font-family:inherit}
.floater{
  position:fixed;z-index:1;pointer-events:none;font-weight:1000;
  color:rgba(47,111,34,.18);font-size:clamp(38px,8vw,110px);
  animation:floaty 9s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-35px) rotate(9deg)}}
.soundbar{
  position:fixed;top:10px;right:10px;z-index:80;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end
}
.soundbar button,.pillBtn{
  border:0;border-radius:999px;padding:11px 14px;background:#fff;color:var(--green);
  font-weight:1000;box-shadow:0 6px 0 rgba(47,111,34,.18);cursor:pointer
}
.logo{
  position:fixed;top:10px;left:10px;z-index:80;border-radius:24px;background:rgba(255,255,255,.75);
  border:2px solid rgba(47,111,34,.25);padding:10px 14px;font-weight:1000;backdrop-filter:blur(12px)
}
.screen{position:fixed;inset:0;display:none;padding:82px 18px 22px;overflow:auto;text-align:center}
.screen.show{display:block}
h1{margin:0;font-size:clamp(46px,12vw,120px);line-height:.85;color:var(--green);text-shadow:0 7px 0 rgba(47,111,34,.15)}
.sub{font-size:clamp(18px,3vw,28px);font-weight:900;max-width:900px;margin:14px auto 18px}
.menu{
  width:min(1060px,96vw);margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:14px
}
.card{
  min-height:230px;border:4px solid #fff;border-radius:36px;background:var(--glass);padding:18px;cursor:pointer;
  box-shadow:0 14px 0 rgba(47,111,34,.14),0 0 40px rgba(255,255,255,.65);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:.2s
}
.card:active{transform:translateY(5px);box-shadow:0 8px 0 rgba(47,111,34,.14)}
.card .emoji{font-size:74px;filter:drop-shadow(0 10px 0 rgba(47,111,34,.12))}
.card h2{margin:0;font-size:28px;color:var(--green)}
.card p{margin:0;font-weight:800;font-size:17px}
.game{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:76px 12px 12px;text-align:center}
.game.show{display:flex}
.game h2{margin:0;font-size:clamp(32px,7vw,72px);line-height:.9;color:var(--green);text-shadow:0 5px 0 rgba(47,111,34,.12)}
.hud{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.pill{background:#fff;border-radius:999px;padding:10px 14px;font-weight:1000;box-shadow:0 7px 0 rgba(47,111,34,.13)}
.bar{width:min(540px,86vw);height:28px;border:3px solid white;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.5)}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#7ec850,#ffe066,#ff6f9f);transition:.1s}
.stage{
  position:relative;width:min(980px,96vw);height:min(62vh,560px);border-radius:40px;overflow:hidden;
  border:5px solid white;background:linear-gradient(160deg,rgba(255,255,255,.75),rgba(202,240,145,.6));
  box-shadow:inset 0 0 60px rgba(255,255,255,.4),0 20px 50px rgba(47,111,34,.2);
  touch-action:none
}
.avocado{
  position:absolute;left:50%;top:50%;width:250px;height:330px;transform:translate(-50%,-50%);
  border-radius:55% 55% 50% 50%;background:linear-gradient(145deg,#98ca45,#2f7b2c);
  box-shadow:inset -24px -24px 0 rgba(0,0,0,.12),0 18px 0 rgba(47,111,34,.15)
}
.avocado::before{
  content:"";position:absolute;left:34px;top:45px;width:180px;height:230px;border-radius:50%;
  background:linear-gradient(#f7ffd1,#cde67a)
}
.avocado::after{
  content:"";position:absolute;left:88px;top:155px;width:75px;height:75px;border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#a86b2c,#6f3b16)
}
.face{position:absolute;left:78px;top:92px;width:95px;height:45px}
.eye{position:absolute;top:0;width:16px;height:22px;background:#17360f;border-radius:50%}
.eye.l{left:12px}.eye.r{right:12px}
.mouth{position:absolute;left:34px;top:22px;width:28px;height:16px;border-bottom:5px solid #17360f;border-radius:0 0 999px 999px}
.cutline{position:absolute;inset:0;border-radius:inherit;border-right:8px dashed rgba(255,255,255,.95);opacity:.9}
.peel{
  position:absolute;width:80px;height:160px;border-radius:80px;background:linear-gradient(#5c9e32,#245c1f);
  opacity:0;transform:scale(.3);transition:.25s
}
.peel.show{opacity:1;transform:scale(1) rotate(var(--r))}
.peel.p1{left:18%;top:24%;--r:-35deg}.peel.p2{right:18%;top:26%;--r:35deg}.peel.p3{left:43%;bottom:4%;--r:5deg}
.tool{
  position:absolute;z-index:20;pointer-events:none;transform:translate(-50%,-50%);font-size:72px;filter:drop-shadow(0 12px 0 rgba(0,0,0,.12));display:none
}
.target{position:absolute;font-size:62px;cursor:pointer;user-select:none;filter:drop-shadow(0 10px 0 rgba(47,111,34,.18));animation:wiggle .7s infinite alternate}
@keyframes wiggle{to{transform:rotate(12deg) scale(1.08)}}
.slice{position:absolute;width:22px;height:120px;border-radius:999px;background:white;opacity:.86;transform:rotate(var(--rot));animation:slash .45s forwards;pointer-events:none}
@keyframes slash{from{transform:scale(.3) rotate(var(--rot));opacity:1}to{transform:scale(1.5) rotate(var(--rot));opacity:0}}
.splat{position:absolute;width:95px;height:70px;border-radius:50%;background:#b9e35a;opacity:.9;animation:splat .7s forwards;pointer-events:none}
@keyframes splat{to{transform:scale(1.7);opacity:0}}
.bigText{
  position:absolute;left:50%;top:18px;transform:translateX(-50%);font-size:clamp(22px,5vw,44px);
  color:#ff6f9f;font-weight:1000;text-shadow:0 3px 0 white;z-index:30;white-space:nowrap
}
.blasterShot{position:absolute;width:20px;height:20px;border-radius:50%;background:#ff6f9f;box-shadow:0 0 20px #ff6f9f;pointer-events:none}
.award{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(47,111,34,.45);backdrop-filter:blur(10px);padding:18px}
.award.show{display:flex}
.awardBox{width:min(760px,94vw);background:white;border-radius:44px;padding:26px 18px;text-align:center;box-shadow:0 22px 0 rgba(47,111,34,.25)}
.awardBox h2{font-size:clamp(42px,10vw,90px);line-height:.88;margin:0;color:var(--green)}
.awardBox p{font-size:22px;font-weight:900}
.confetti{position:fixed;top:-30px;width:15px;height:24px;z-index:300;animation:fall 2.3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(800deg);opacity:.15}}
@media(max-width:760px){
  .menu{grid-template-columns:1fr}.card{min-height:170px}
  .soundbar{left:10px;top:auto;bottom:10px;justify-content:center}
  .logo{font-size:13px}.screen{padding-top:70px}.game{padding-top:68px;padding-bottom:66px}
  .stage{height:57vh}.avocado{width:200px;height:270px}.avocado::before{left:28px;top:38px;width:144px;height:185px}.avocado::after{left:70px;top:130px}
}
</style>
</head>
<body>
<div class="floater" style="left:7%;top:20%">6</div>
<div class="floater" style="right:8%;top:18%;animation-delay:1s">7</div>
<div class="floater" style="left:18%;bottom:12%;animation-delay:2s">7</div>
<div class="floater" style="right:22%;bottom:14%;animation-delay:3s">6</div>

<div class="logo">KIMI KIREI 🥑 AVO MANIA</div>
<div class="soundbar">
  <button onclick="toggleSound()" id="soundBtn">🔊 Sound On</button>
  <button onclick="playSillySound()">✨ Silly Sound</button>
  <button onclick="playBeat()">🥁 Beat</button>
</div>

<section class="screen show" id="home">
  <h1>Avo Mania</h1>
  <p class="sub">Cut it, peel it, mash it, and blast flying avocados with a soft foam popper. Big silly sounds, scores, combos and chaos.</p>
  <div class="menu">
    <button class="card" onclick="startMode('peel')"><div class="emoji">🔪🥑</div><h2>Cut & Peel</h2><p>Trace the line, peel the skin, reveal the shiny avo.</p></button>
    <button class="card" onclick="startMode('mash')"><div class="emoji">🔨🥑</div><h2>Mash Attack</h2><p>Tap fast with the toy hammer and make guacamole splats.</p></button>
    <button class="card" onclick="startMode('blast')"><div class="emoji">🫧🥑</div><h2>Flying Avo Pop</h2><p>No real guns — just a foam popper for flying avocados.</p></button>
  </div>
</section>

<section class="game" id="game">
  <h2 id="title">Cut & Peel</h2>
  <div class="hud">
    <div class="pill" id="score">Score: 0</div>
    <div class="pill" id="combo">Combo: 0</div>
    <div class="pill" id="timer">Time: 45</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>
  <div class="stage" id="stage">
    <div class="bigText" id="msg">GO!</div>
    <div class="avocado" id="avo"><div class="cutline"></div><div class="face"><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div></div>
    <div class="peel p1"></div><div class="peel p2"></div><div class="peel p3"></div>
    <div class="tool" id="tool">🔪</div>
  </div>
  <button class="pillBtn" onclick="goHome()">Home</button>
</section>

<div class="award" id="award">
  <div class="awardBox">
    <h2 id="awardTitle">AVO LEGEND!</h2>
    <p id="awardText">You smashed it.</p>
    <button class="pillBtn" onclick="startMode(currentMode)">Play Again</button>
    <button class="pillBtn" onclick="goHome()">Home</button>
  </div>
</div>

<script>
const home=document.getElementById("home"),game=document.getElementById("game"),stage=document.getElementById("stage"),tool=document.getElementById("tool");
const scoreEl=document.getElementById("score"),comboEl=document.getElementById("combo"),timerEl=document.getElementById("timer"),fill=document.getElementById("fill");
const msg=document.getElementById("msg"),title=document.getElementById("title"),award=document.getElementById("award"),awardTitle=document.getElementById("awardTitle"),awardText=document.getElementById("awardText");
let currentMode="peel",score=0,combo=0,progress=0,time=45,playing=false,timerInt=null,soundOn=true,audioCtx=null,dragging=false,last={x:0,y:0},spawnInt=null;

function ctx(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function tone(f,d=.12,type="sine",vol=.07){
  if(!soundOn)return; try{const a=ctx(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.start();o.stop(a.currentTime+d)}catch(e){}
}
function noise(d=.18,vol=.05){
  if(!soundOn)return; const a=ctx(),buffer=a.createBuffer(1,a.sampleRate*d,a.sampleRate),data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);
  const src=a.createBufferSource(),g=a.createGain();src.buffer=buffer;src.connect(g);g.connect(a.destination);g.gain.value=vol;src.start();
}
function playSillySound(){tone(720,.08,"square");setTimeout(()=>tone(980,.08,"square"),90);setTimeout(()=>tone(420,.16,"sawtooth"),190)}
function playBeat(){tone(110,.12,"sine",.12);setTimeout(()=>noise(.08,.08),160);setTimeout(()=>tone(160,.1,"sine",.1),320);setTimeout(()=>noise(.08,.08),480)}
function toggleSound(){soundOn=!soundOn;document.getElementById("soundBtn").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off"; if(soundOn) playSillySound()}
function resetStage(){
  stage.querySelectorAll(".target,.slice,.splat,.blasterShot").forEach(e=>e.remove());
  document.querySelectorAll(".peel").forEach(p=>p.classList.remove("show"));
  document.getElementById("avo").style.transform="translate(-50%,-50%) scale(1) rotate(0)";
  tool.style.display="none"; fill.style.width="0%";
}
function startMode(mode){
  currentMode=mode;score=0;combo=0;progress=0;time=45;playing=true;resetStage();award.classList.remove("show");home.classList.remove("show");game.classList.add("show");
  title.textContent=mode==="peel"?"Cut & Peel Challenge":mode==="mash"?"Mash Attack":"Flying Avo Pop";
  msg.textContent=mode==="peel"?"Trace the dotted line!":mode==="mash"?"Tap the avocado fast!":"Tap flying avocados!";
  tool.textContent=mode==="peel"?"🔪":mode==="mash"?"🔨":"🫧"; updateHud(); clearInterval(timerInt); clearInterval(spawnInt);
  timerInt=setInterval(()=>{time--;updateHud(); if(time<=0)finish()},1000);
  if(mode==="blast") spawnInt=setInterval(spawnAvo,650);
  if(mode==="mash") pulseAvo();
}
function updateHud(){scoreEl.textContent="Score: "+score;comboEl.textContent="Combo: "+combo;timerEl.textContent="Time: "+time;fill.style.width=Math.min(100,progress)+"%"}
function addPoints(n){score+=n;combo++;progress+=n/3;updateHud(); if(combo%6===0){msg.textContent=["WOW!","MEGA!","AVO POWER!","LEVEL 6!","LEVEL 7!"][Math.floor(Math.random()*5)];confetti(18);playBeat()} if(progress>=100)finish();}
function pos(e){const t=e.touches?e.touches[0]:e,r=stage.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top,px:t.clientX,py:t.clientY}}
function slash(x,y){const s=document.createElement("div");s.className="slice";s.style.left=x+"px";s.style.top=y+"px";s.style.setProperty("--rot",(Math.random()*80-40)+"deg");stage.appendChild(s);setTimeout(()=>s.remove(),500)}
function splat(x,y){const s=document.createElement("div");s.className="splat";s.style.left=(x-45)+"px";s.style.top=(y-35)+"px";stage.appendChild(s);setTimeout(()=>s.remove(),750)}
function pointerDown(e){if(!playing)return;dragging=true;const p=pos(e);last=p;tool.style.display="block";tool.style.left=p.x+"px";tool.style.top=p.y+"px"; if(currentMode==="mash")hitMash(p)}
function pointerMove(e){if(!playing||!dragging)return;e.preventDefault();const p=pos(e);tool.style.left=p.x+"px";tool.style.top=p.y+"px"; if(currentMode==="peel"){const dist=Math.hypot(p.x-last.x,p.y-last.y); const r=stage.getBoundingClientRect(); const nearLine=p.x>r.width*.46&&p.x<r.width*.62&&p.y>r.height*.18&&p.y<r.height*.82; if(dist>7&&nearLine){slash(p.x,p.y);addPoints(2);tone(640+combo*8,.05,"triangle"); if(progress>30)document.querySelector(".p1").classList.add("show"); if(progress>58)document.querySelector(".p2").classList.add("show"); if(progress>82)document.querySelector(".p3").classList.add("show");} last=p;}}
function pointerUp(){dragging=false;tool.style.display="none"}
function hitMash(p){if(currentMode!=="mash")return; const r=stage.getBoundingClientRect(); if(p.x>r.width*.32&&p.x<r.width*.68&&p.y>r.height*.22&&p.y<r.height*.82){splat(p.x,p.y);addPoints(4);tone(180,.08,"square",.08);noise(.06,.035);document.getElementById("avo").style.transform=`translate(-50%,-50%) scale(${1+Math.random()*.08}) rotate(${Math.random()*14-7}deg)`; setTimeout(()=>document.getElementById("avo").style.transform="translate(-50%,-50%) scale(1) rotate(0)",100)}}
function pulseAvo(){if(currentMode!=="mash"&&playing)return; if(playing&&currentMode==="mash"){document.getElementById("avo").style.filter="drop-shadow(0 0 25px rgba(255,224,102,.9))";setTimeout(()=>document.getElementById("avo").style.filter="",180);setTimeout(pulseAvo,900)}}
function spawnAvo(){
  if(!playing||currentMode!=="blast")return; const t=document.createElement("div");t.className="target";t.textContent=Math.random()>.16?"🥑":"⭐";
  const y=60+Math.random()*(stage.clientHeight-140); const fromLeft=Math.random()>.5; t.style.top=y+"px"; t.style.left=(fromLeft?-80:stage.clientWidth+40)+"px";
  stage.appendChild(t); const duration=2200-Math.min(900,combo*18); const end=fromLeft?stage.clientWidth+80:-120; const start=performance.now();
  function anim(now){const k=Math.min(1,(now-start)/duration); t.style.left=((fromLeft?-80:stage.clientWidth+40)+(end-(fromLeft?-80:stage.clientWidth+40))*k)+"px"; if(k<1&&t.parentNode)requestAnimationFrame(anim); else t.remove()}
  requestAnimationFrame(anim);
  t.onclick=(e)=>{e.stopPropagation(); const r=stage.getBoundingClientRect(); const x=e.clientX-r.left,y=e.clientY-r.top; shot(x,y); splat(x,y); t.remove(); addPoints(t.textContent==="⭐"?10:5); tone(520+Math.random()*300,.08,"square");};
}
function shot(x,y){const b=document.createElement("div");b.className="blasterShot";b.style.left="50%";b.style.bottom="10px";stage.appendChild(b);b.animate([{transform:"translate(0,0)"},{transform:`translate(${x-stage.clientWidth/2}px,${y-stage.clientHeight+20}px)`}],{duration:170,easing:"ease-out"});setTimeout(()=>b.remove(),190)}
function finish(){
  if(!playing)return; playing=false;clearInterval(timerInt);clearInterval(spawnInt);tool.style.display="none";
  awardTitle.textContent=score>160?"AVO LEGEND!":score>90?"AVO HERO!":"NICE AVO!";
  awardText.textContent=`Score ${score}. Combo ${combo}. ${currentMode==="blast"?"Foam popper master!":"Proper smooth avocado chaos!"}`;
  confetti(130);playSillySound();setTimeout(()=>playBeat(),250);award.classList.add("show");
}
function goHome(){playing=false;clearInterval(timerInt);clearInterval(spawnInt);award.classList.remove("show");game.classList.remove("show");home.classList.add("show")}
function confetti(n){const colors=["#2f6f22","#bde86a","#ff6f9f","#ffe066","#fff"];for(let i=0;i<n;i++){const c=document.createElement("div");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=colors[Math.floor(Math.random()*colors.length)];c.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),2600)}}

stage.addEventListener("mousedown",pointerDown);stage.addEventListener("mousemove",pointerMove);window.addEventListener("mouseup",pointerUp);
stage.addEventListener("touchstart",pointerDown,{passive:false});stage.addEventListener("touchmove",pointerMove,{passive:false});window.addEventListener("touchend",pointerUp);
stage.addEventListener("click",e=>{if(currentMode==="mash"&&playing)hitMash(pos(e))});
</script>
</body>
</html>
