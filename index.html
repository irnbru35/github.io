<!DOCTYPE html>
<html>
<head>
<title>Jamies Brushes</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:'Orbitron', sans-serif;
color:white;
text-align:center;
overflow:hidden;
background:black;
}

/* keep background */
body::before{
content:"";
position:fixed;
inset:0;
background-image:url("Kimi.jpeg");
background-size:cover;
background-position:center;
opacity:0.48;
z-index:-5;
}

body::after{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 50% 45%, rgba(0,255,204,0.20), transparent 35%),
radial-gradient(circle at 20% 20%, rgba(140,0,255,0.18), transparent 35%),
rgba(0,0,0,0.55);
z-index:-4;
}

/* space background */
.space{
position:fixed;
inset:0;
z-index:-3;
background:
radial-gradient(circle at 15% 25%, white 0px, transparent 2px),
radial-gradient(circle at 35% 60%, white 0px, transparent 1.5px),
radial-gradient(circle at 55% 35%, white 0px, transparent 2px),
radial-gradient(circle at 75% 70%, white 0px, transparent 1.5px),
radial-gradient(circle at 90% 30%, white 0px, transparent 2px),
radial-gradient(circle at 45% 85%, white 0px, transparent 1.5px),
radial-gradient(circle at 65% 15%, white 0px, transparent 1px);
background-size:260px 260px;
animation:spaceDrift 35s linear infinite;
opacity:0.85;
}

.nebula{
position:fixed;
inset:-20%;
z-index:-2;
background:
radial-gradient(circle at 30% 40%, rgba(0,255,204,0.18), transparent 28%),
radial-gradient(circle at 70% 55%, rgba(140,80,255,0.20), transparent 30%),
radial-gradient(circle at 50% 80%, rgba(255,255,255,0.08), transparent 25%);
filter:blur(35px);
animation:nebulaMove 18s ease-in-out infinite alternate;
}

/* main centre area */
.stage{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:min(1000px,95%);
height:260px;
display:flex;
align-items:center;
justify-content:center;
}

/* flipping text */
.flip{
position:relative;
font-size:96px;
font-weight:800;
height:120px;
overflow:hidden;
color:#00ffcc;
text-shadow:
0 0 10px #00ffcc,
0 0 30px #00ffcc,
0 0 75px rgba(0,255,204,0.9);
animation:pulseGlow 2s infinite alternate;
z-index:2;
}

/* this is the wipe/erase layer */
.flip::after{
content:"";
position:absolute;
top:0;
left:-35%;
width:32%;
height:100%;
background:linear-gradient(
90deg,
transparent,
rgba(0,0,0,0.95),
rgba(255,255,255,0.95),
rgba(0,0,0,0.95),
transparent
);
filter:blur(2px);
animation:eraseSweep 4.5s ease-in-out infinite;
z-index:5;
}

/* hairbrush */
.brush{
position:absolute;
top:50%;
left:-260px;
width:230px;
height:74px;
transform:translateY(-50%) rotate(-8deg);
z-index:8;
animation:brushSweep 4.5s ease-in-out infinite;
filter:drop-shadow(0 0 18px rgba(0,255,204,0.8));
}

/* handle */
.brush .handle{
position:absolute;
right:0;
top:22px;
width:150px;
height:30px;
border-radius:999px;
background:linear-gradient(90deg,#111,#00ffcc,#ffffff);
box-shadow:
inset 0 0 8px rgba(255,255,255,0.7),
0 0 20px rgba(0,255,204,0.6);
}

/* brush head */
.brush .head{
position:absolute;
left:0;
top:0;
width:88px;
height:74px;
border-radius:28px;
background:linear-gradient(135deg,#ffffff,#00ffcc,#034);
box-shadow:
inset 0 0 15px rgba(255,255,255,0.9),
0 0 25px rgba(0,255,204,0.8);
}

/* bristles */
.brush .bristle{
position:absolute;
top:62px;
width:4px;
height:38px;
background:white;
border-radius:999px;
box-shadow:0 0 10px white;
}

.brush .bristle:nth-child(3){left:10px;}
.brush .bristle:nth-child(4){left:24px;}
.brush .bristle:nth-child(5){left:38px;}
.brush .bristle:nth-child(6){left:52px;}
.brush .bristle:nth-child(7){left:66px;}

/* small clean dust particles */
.dust span{
position:absolute;
top:50%;
width:6px;
height:6px;
background:white;
border-radius:50%;
box-shadow:0 0 14px white;
opacity:0;
animation:dustPop 4.5s ease-in-out infinite;
z-index:7;
}

.dust span:nth-child(1){left:35%; animation-delay:0.8s;}
.dust span:nth-child(2){left:43%; animation-delay:1s;}
.dust span:nth-child(3){left:52%; animation-delay:1.2s;}
.dust span:nth-child(4){left:61%; animation-delay:1.4s;}
.dust span:nth-child(5){left:70%; animation-delay:1.6s;}

.words{
animation:flipWords 7s infinite;
}

.words div{
height:120px;
}

/* animations */
@keyframes brushSweep{
0%{left:-260px; transform:translateY(-50%) rotate(-8deg);}
42%{left:50%; transform:translate(-50%,-50%) rotate(4deg);}
72%{left:110%; transform:translateY(-50%) rotate(-8deg);}
100%{left:110%; transform:translateY(-50%) rotate(-8deg);}
}

@keyframes eraseSweep{
0%{left:-35%; opacity:0;}
20%{opacity:1;}
65%{left:105%; opacity:1;}
80%{opacity:0;}
100%{left:105%; opacity:0;}
}

@keyframes dustPop{
0%,35%,100%{
opacity:0;
transform:translateY(0) scale(0.5);
}
45%{
opacity:1;
transform:translateY(-45px) scale(1.3);
}
60%{
opacity:0;
transform:translateY(-85px) scale(0.2);
}
}

@keyframes flipWords{
0%{transform:translateY(0);}
25%{transform:translateY(0);}
35%{transform:translateY(-120px);}
58%{transform:translateY(-120px);}
68%{transform:translateY(-240px);}
90%{transform:translateY(-240px);}
100%{transform:translateY(0);}
}

@keyframes spaceDrift{
from{background-position:0 0;}
to{background-position:520px -520px;}
}

@keyframes nebulaMove{
from{transform:translate(-2%, -2%) scale(1);}
to{transform:translate(2%, 2%) scale(1.08);}
}

@keyframes pulseGlow{
from{
text-shadow:0 0 12px #00ffcc,0 0 30px #00ffcc;
}
to{
text-shadow:0 0 24px #00ffcc,0 0 60px #00ffcc,0 0 110px #00ffcc;
}
}

@media(max-width:700px){
.stage{
height:220px;
}

.flip{
font-size:48px;
height:70px;
}

.words div{
height:70px;
}

.brush{
width:150px;
height:50px;
}

.brush .handle{
width:95px;
height:22px;
top:14px;
}

.brush .head{
width:58px;
height:50px;
border-radius:18px;
}

.brush .bristle{
top:42px;
height:25px;
}

@keyframes flipWords{
0%{transform:translateY(0);}
25%{transform:translateY(0);}
35%{transform:translateY(-70px);}
58%{transform:translateY(-70px);}
68%{transform:translateY(-140px);}
90%{transform:translateY(-140px);}
100%{transform:translateY(0);}
}
}
</style>
</head>

<body>

<div class="space"></div>
<div class="nebula"></div>

<div class="stage">

<div class="flip">
<div class="words">
<div>Jamie</div>
<div>is</div>
<div>awesome</div>
</div>
</div>

<div class="brush">
<div class="head"></div>
<div class="handle"></div>
<div class="bristle"></div>
<div class="bristle"></div>
<div class="bristle"></div>
<div class="bristle"></div>
<div class="bristle"></div>
</div>

<div class="dust">
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
</div>

</div>

</body>
</html>
