<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funny Furniture Game</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#fff3d6,#e8f7ff,#ffffff);
  color:#102033;
  text-align:center;
}

header{
  padding:35px 20px 15px;
}

h1{
  font-size:42px;
  margin:10px 0;
}

p{
  font-size:18px;
}

#game{
  position:relative;
  width:90%;
  max-width:760px;
  height:520px;
  margin:25px auto;
  background:#fff8e8;
  border:6px solid #222;
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 15px 35px rgba(0,0,0,.18);
}

#player{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  font-size:58px;
  z-index:5;
}

.item{
  position:absolute;
  top:-70px;
  font-size:54px;
  animation:fall linear forwards;
}

@keyframes fall{
  to{top:560px}
}

#score{
  font-size:26px;
  font-weight:bold;
}

#message{
  font-size:20px;
  font-weight:bold;
  min-height:28px;
}

button{
  background:#ff8a00;
  color:white;
  border:none;
  padding:15px 28px;
  border-radius:35px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#e67800;
}

footer{
  background:#10201d;
  color:white;
  padding:25px 20px;
  margin-top:35px;
}

@media(max-width:650px){
  h1{font-size:32px}
  #game{height:460px}
}
</style>
</head>

<body>

<header>
  <h1>🛋️ Funny Furniture Frenzy</h1>
  <p><strong>Catch the comfy furniture. Avoid the angry toilet!</strong></p>
  <div id="score">Score: 0</div>
</header>

<div id="game">
  <div id="player">🧍</div>
</div>

<div id="message">Use left and right arrows, or tap the screen.</div>
<button onclick="restartGame()">Restart Game</button>

<footer>
  <p>© Funny Furniture Frenzy</p>
  <p>Sofas good. Toilets bad.</p>
</footer>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");

let score = 0;
let playerX = 350;
let gameOver = false;
let spawnTimer;

const goodItems = ["🛋️","🪑","🛏️","🪞","🗄️","💡"];
const badItems = ["🚽","🪠","🧻"];

function updatePlayer(){
  player.style.left = playerX + "px";
}

document.addEventListener("keydown", e=>{
  if(gameOver) return;

  if(e.key === "ArrowLeft") playerX -= 45;
  if(e.key === "ArrowRight") playerX += 45;

  playerX = Math.max(30, Math.min(game.clientWidth - 30, playerX));
  updatePlayer();
});

game.addEventListener("touchstart", e=>{
  if(gameOver) return;

  const touchX = e.touches[0].clientX - game.getBoundingClientRect().left;
  playerX = touchX;
  playerX = Math.max(30, Math.min(game.clientWidth - 30, playerX));
  updatePlayer();
});

game.addEventListener("click", e=>{
  if(gameOver) return;

  playerX = e.clientX - game.getBoundingClientRect().left;
  playerX = Math.max(30, Math.min(game.clientWidth - 30, playerX));
  updatePlayer();
});

function spawnItem(){
  if(gameOver) return;

  const item = document.createElement("div");
  item.className = "item";

  const isBad = Math.random() < 0.28;
  item.textContent = isBad 
    ? badItems[Math.floor(Math.random()*badItems.length)]
    : goodItems[Math.floor(Math.random()*goodItems.length)];

  item.dataset.bad = isBad;
  item.style.left = Math.random() * (game.clientWidth - 60) + "px";
  item.style.animationDuration = (2.2 + Math.random()*1.4) + "s";

  game.appendChild(item);

  const check = setInterval(()=>{
    const itemRect = item.getBoundingClientRect();
    const playerRect = player.getBoundingClientRect();

    const hit = !(
      itemRect.right < playerRect.left ||
      itemRect.left > playerRect.right ||
      itemRect.bottom < playerRect.top ||
      itemRect.top > playerRect.bottom
    );

    if(hit){
      clearInterval(check);
      item.remove();

      if(item.dataset.bad === "true"){
        endGame();
      }else{
        score++;
        scoreText.textContent = "Score: " + score;

        const sayings = [
          "Lovely sofa save!",
          "Chair caught!",
          "That mirror was expensive!",
          "Furniture hero!",
          "Interior design legend!"
        ];

        message.textContent = sayings[Math.floor(Math.random()*sayings.length)];
      }
    }

    if(itemRect.top > window.innerHeight){
      clearInterval(check);
      item.remove();
    }
  },30);
}

function endGame(){
  gameOver = true;
  clearInterval(spawnTimer);
  message.textContent = "Game over! You got attacked by bathroom furniture 🚽";
}

function restartGame(){
  score = 0;
  gameOver = false;
  scoreText.textContent = "Score: 0";
  message.textContent = "Use left and right arrows, or tap the screen.";
  document.querySelectorAll(".item").forEach(i=>i.remove());

  playerX = game.clientWidth / 2;
  updatePlayer();

  clearInterval(spawnTimer);
  spawnTimer = setInterval(spawnItem, 850);
}

restartGame();
</script>

</body>
</html>
