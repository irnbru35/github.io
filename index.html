<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kimi Kirei Smart AvoBrush</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#effff5,#eef8ff);
  color:#123d2a;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px;
  overflow:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:url("kimi.jpeg") center/850px no-repeat;
  opacity:.12;
  z-index:-2;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 15% 20%,rgba(53,184,107,.18),transparent 30%),
    radial-gradient(circle at 85% 75%,rgba(255,105,180,.16),transparent 32%),
    radial-gradient(circle at 70% 15%,rgba(100,216,255,.20),transparent 28%);
  z-index:-1;
}

.card{
  width:100%;
  max-width:640px;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(14px);
  border-radius:34px;
  padding:46px 36px;
  text-align:center;
  box-shadow:0 25px 80px rgba(0,0,0,.14);
  border:1px solid rgba(53,184,107,.22);
}

.logo{
  width:420px;
  max-width:96%;
  height:auto;
  margin-bottom:22px;
  animation:floatLogo 4s ease-in-out infinite;
}

@keyframes floatLogo{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

h1{
  font-size:42px;
  line-height:1.08;
  margin:0 0 14px;
}

.tagline{
  font-size:19px;
  line-height:1.5;
  color:#4c6659;
  margin:0 0 28px;
}

.highlight{
  color:#35b86b;
  font-weight:800;
}

form{
  display:flex;
  gap:10px;
  margin-top:18px;
}

input{
  flex:1;
  padding:17px;
  font-size:16px;
  border:2px solid #d9eadf;
  border-radius:16px;
  outline:none;
}

input:focus{
  border-color:#35b86b;
}

button{
  padding:17px 24px;
  border:none;
  border-radius:16px;
  background:#35b86b;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#2ca25d;
}

#message{
  margin-top:16px;
  color:#35b86b;
  font-weight:bold;
}

.features{
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
  margin-top:26px;
}

.feature{
  background:#f3fff7;
  border:1px solid #d9eadf;
  border-radius:16px;
  padding:10px 14px;
  font-size:14px;
  font-weight:bold;
  color:#315744;
}

.footer{
  margin-top:26px;
  font-size:13px;
  color:#789187;
}

@media(max-width:620px){
  body{overflow:auto}
  .card{padding:32px 22px}
  h1{font-size:32px}
  form{flex-direction:column}
  button{width:100%}
}
</style>
</head>

<body>

<main class="card">

  <img src="./Avo%20Brush%20logo%20final.jpeg" alt="Kimi Kirei Smart AvoBrush Logo" class="logo">

  <h1>Kimi Kirei<br>Smart AvoBrush</h1>

  <p class="tagline">
    Enter your email to register interest for pre-order of the
    <span class="highlight">first ever smart interactive hairbrush for children.</span>
  </p>

  <form id="prelaunchForm">
    <input type="email" id="email" placeholder="Enter your email address" required>
    <button type="submit">Join Pre-Launch</button>
  </form>

  <div id="message"></div>

  <div class="features">
    <div class="feature">🟢 Guided brushing</div>
    <div class="feature">🔊 Voice prompts</div>
    <div class="feature">✨ Lights & vibration</div>
  </div>

  <div class="footer">
    Smart Brush UK Ltd · Product in development · Pre-orders opening soon
  </div>

</main>

<script>
const form = document.getElementById("prelaunchForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(event) {
  event.preventDefault();
  message.textContent = "Thank you — you're on the pre-launch list!";
  form.reset();
});
</script>

</body>
</html>
