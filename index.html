<!DOCTYPE html>
<html>
<head>
<title>Jamies Private Project</title>

<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
overflow:hidden;
background:black;
font-family:'Archivo Black', Arial, sans-serif;
}

/* keep your background */
body::before{
content:"";
position:fixed;
inset:0;
background-image:url("Kimi.jpeg");
background-size:cover;
background-position:center;
opacity:0.48;
z-index:-3;
}

/* dark overlay */
body::after{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,0.45);
z-index:-2;
}

/* huge stamped mark */
.stamp{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%) rotate(-12deg);
width:92vw;
padding:35px 20px;

color:#ff1f1f;
border:14px solid #ff1f1f;
border-radius:18px;

font-size:clamp(38px, 8vw, 120px);
text-align:center;
letter-spacing:5px;
line-height:1.05;
text-transform:uppercase;

text-shadow:
2px 2px 0 rgba(0,0,0,0.4),
0 0 12px rgba(255,0,0,0.55);

box-shadow:
0 0 0 6px rgba(255,31,31,0.35),
0 0 35px rgba(255,0,0,0.45);

opacity:0.9;
mix-blend-mode:screen;

animation:stampHit 0.8s ease-out forwards;
}

/* inner stamp border */
.stamp::before{
content:"";
position:absolute;
inset:14px;
border:5px solid #ff1f1f;
border-radius:8px;
opacity:0.85;
}

/* distressed stamp texture */
.stamp::after{
content:"";
position:absolute;
inset:0;
background:
repeating-linear-gradient(
45deg,
rgba(0,0,0,0.18) 0px,
rgba(0,0,0,0.18) 3px,
transparent 3px,
transparent 9px
);
opacity:0.35;
pointer-events:none;
}

@keyframes stampHit{
0%{
opacity:0;
transform:translate(-50%,-50%) rotate(-12deg) scale(2.2);
filter:blur(8px);
}
55%{
opacity:1;
transform:translate(-50%,-50%) rotate(-12deg) scale(0.92);
filter:blur(0);
}
75%{
transform:translate(-50%,-50%) rotate(-12deg) scale(1.04);
}
100%{
transform:translate(-50%,-50%) rotate(-12deg) scale(1);
}
}

@media(max-width:700px){
.stamp{
width:95vw;
border-width:8px;
letter-spacing:2px;
padding:25px 12px;
}

.stamp::before{
inset:9px;
border-width:3px;
}
}
</style>
</head>

<body>

<div class="stamp">
JAMIES PRIVATE PROJECT
</div>

</body>
</html>
