<!DOCTYPE html>
<html>
<head>
<title>Jamies Brushes</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:'Orbitron', sans-serif;
color:white;
text-align:center;
overflow:hidden;
background:black;
cursor:crosshair;
}

/* background image */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background-image:url("Kimi.jpeg");
background-size:cover;
background-position:center;
opacity:0.55;
z-index:-4;
}

/* cyber overlay */
body::after{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at center, rgba(0,255,204,0.15), transparent 40%),
rgba(0,0,0,0.45);
z-index:-3;
}

/* animated grid */
.grid{
position:fixed;
width:100%;
height:100%;
background-image:
linear-gradient(rgba(0,255,204,0.12) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,255,204,0.12) 1px, transparent 1px);
background-size:50px 50px;
animation:gridMove 12s linear infinite;
z-index:-2;
}

/* stars */
.star{
position:fixed;
width:3px;
height:3px;
background:#ffffff;
border-radius:50%;
box-shadow:0 0 12px white;
animation:starFloat 8s linear infinite;
z-index:-1;
}

.star:nth-child(1){left:8%; animation-delay:0s;}
.star:nth-child(2){left:18%; animation-delay:1s;}
.star:nth-child(3){left:28%; animation-delay:2s;}
.star:nth-child(4){left:38%; animation-delay:3s;}
.star:nth-child(5){left:48%; animation-delay:4s;}
.star:nth-child(6){left:58%; animation-delay:5s;}
.star:nth-child(7){left:68%; animation-delay:1.5s;}
.star:nth-child(8){left:78%; animation-delay:2.5s;}
.star:nth-child(9){left:88%; animation-delay:3.5s;}
.star:nth-child(10){left:96%; animation-delay:4.5s;}

/* center text */
.center{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:100%;
padding:20px;
}

.title{
font-size:22px;
letter-spacing:6px;
color:white;
opacity:0.9;
margin-bottom:25px;
text-shadow:0 0 15px #00ffcc;
}

.flip{
font-size:95px;
font-weight:800;
color:#00ffcc;
height:120px;
overflow:hidden;
text-shadow:
0 0 10px #00ffcc,
0 0 25px #00ffcc,
0 0 55px #00ffcc;
animation:pulseGlow 1.8s infinite alternate;
}

.words{
animation:flipWords 6s infinite;
}

.words div{
height:120px;
}

.subtitle{
font-size:20px;
margin-top:25px;
letter-spacing:3px;
color:white;
text-shadow:0 0 12px #00ffcc;
}

button{
margin-top:35px;
padding:16px 36px;
font-size:18px;
font-family:'Orbitron', sans-serif;
background:transparent;
color:#00ffcc;
border:2px solid #00ffcc;
border-radius:40px;
cursor:pointer;
box-shadow:0 0 18px #00ffcc;
transition:0.3s;
}

button:hover{
background:#00ffcc;
color:black;
transform:scale(1.08);
box-shadow:0 0 45px #00ffcc;
}

/* sparkles */
.sparkle{
position:fixed;
width:7px;
height:7px;
background:#00ffcc;
border-radius:50%;
box-shadow:0 0 14px #00ffcc;
animation:sparkleMove 5s linear infinite;
z-index:2;
}

.sparkle:nth-child(1){left:12%; animation-delay:0s;}
.sparkle:nth-child(2){left:22%; animation-delay:1s;}
.sparkle:nth-child(3){left:35%; animation-delay:2s;}
.sparkle:nth-child(4){left:50%; animation-delay:3s;}
.sparkle:nth-child(5){left:66%; animation-delay:4s;}
.sparkle:nth-child(6){left:82%; animation-delay:1.5s;}
.sparkle:nth-child(7){left:92%; animation-delay:2.5s;}

/* cursor trail */
.trail{
position:fixed;
width:12px;
height:12px;
background:#00ffcc;
border-radius:50%;
pointer-events:none;
box-shadow:0 0 20px #00ffcc;
animation:trailFade 0.7s linear forwards;
z-index:99;
}

@keyframes flipWords{
0%{transform:translateY(0);}
25%{transform:translateY(0);}
35%{transform:translateY(-120px);}
58%{transform:translateY(-120px);}
68%{transform:translateY(-240px);}
90%{transform:translateY(-240px);}
100%{transform:translateY(0);}
}

@keyframes pulseGlow{
from{
text-shadow:
0 0 10px #00ffcc,
0 0 25px #00ffcc,
0 0 50px #00ffcc;
}
to{
text-shadow:
0 0 20px #00ffcc,
0 0 45px #00ffcc,
0 0 90px #00ffcc;
}
}

@keyframes sparkleMove{
0%{
top:100%;
transform:scale(0.5) rotate(0deg);
opacity:0;
}
50%{
opacity:1;
}
100%{
top:-10%;
transform:scale(1.4) rotate(360deg);
opacity:0;
}
}

@keyframes starFloat{
0%{
top:100%;
opacity:0;
}
50%{
opacity:1;
}
100%{
top:-10%;
opacity:0;
}
}

@keyframes gridMove{
from{
background-position:0 0;
}
to{
background-position:50px 50px;
}
}

@keyframes trailFade{
from{
opacity:1;
transform:scale(1);
}
to{
opacity:0;
transform:scale(0);
}
}

@media(max-width:700px){
.flip{
font-size:52px;
height:75px;
}

.words div{
height:75px;
}

@keyframes flipWords{
0%{transform:translateY(0);}
25%{transform:translateY(0);}
35%{transform:translateY(-75px);}
58%{transform:translateY(-75px);}
68%{transform:translateY(-150px);}
90%{transform:translateY(-150px);}
100%{transform:translateY(0);}
}

.title{
font-size:14px;
letter-spacing:3px;
}

.subtitle{
font-size:14px;
}
}
</style>
</head>

<body>

<div class="grid"></div>

<div class="star"></div>
<div class="star"></div>
<div class="star"></div>
<div class="star"></div>
<div class="star"></div>
<div class="star"></div>
<div class="star"></div>
<div class="star"></div>
<div class="star"></div>
<div class="star"></div>

<div class="sparkle"></div>
<div class="sparkle"></div>
<div class="sparkle"></div>
<div class="sparkle"></div>
<div class="sparkle"></div>
<div class="sparkle"></div>
<div class="sparkle"></div>

<div class="center">
<div class="title">JAMIES BRUSHES</div>

<div class="flip">
<div class="words">
<div>Jamie</div>
<div>is</div>
<div>awesome</div>
</div>
</div>

<div class="subtitle">Modern brushes. Smooth style. Big energy.</div>

<button onclick="playSound()">Make Magic ✨</button>
</div>

<audio id="magicSound">
<source src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg" type="audio/ogg">
</audio>

<script>
function playSound(){
const sound = document.getElementById("magicSound");
sound.currentTime = 0;
sound.play();
}

document.addEventListener("mousemove", function(e){
const trail = document.createElement("div");
trail.className = "trail";
trail.style.left = e.clientX + "px";
trail.style.top = e.clientY + "px";
document.body.appendChild(trail);

setTimeout(function(){
trail.remove();
}, 700);
});
</script>

</body>
</html>
