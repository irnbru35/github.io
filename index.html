<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KimiBrush</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
height:100vh;
overflow:hidden;
background:#050505;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
color:white;
}

body::before{
content:"";
position:fixed;
inset:0;
background:url("Kimi.jpeg") center/cover no-repeat;
opacity:.35;
z-index:-5;
animation:bgMove 18s ease-in-out infinite alternate;
}

body::after{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 50% 35%,rgba(255,255,255,.18),transparent 32%),
linear-gradient(to bottom,rgba(0,0,0,.08),rgba(0,0,0,.92));
z-index:-4;
}

@keyframes bgMove{
from{transform:scale(1)}
to{transform:scale(1.08);filter:blur(2px)}
}

.topbar{
position:fixed;
top:18px;
left:50%;
transform:translateX(-50%);
width:min(94vw,1080px);
z-index:20;
display:flex;
align-items:center;
justify-content:space-between;
gap:18px;
padding:12px;
border-radius:999px;
border:1px solid rgba(255,255,255,.18);
background:rgba(255,255,255,.08);
backdrop-filter:blur(28px);
box-shadow:0 25px 80px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.28);
animation:menuDrop 1s ease both;
}

.logo{
padding-left:14px;
font-size:16px;
font-weight:800;
letter-spacing:3px;
}

.navlinks{
display:flex;
gap:8px;
}

.navlinks button{
position:relative;
overflow:hidden;
border:1px solid rgba(255,255,255,.12);
border-radius:999px;
padding:13px 18px;
background:rgba(255,255,255,.055);
color:rgba(255,255,255,.78);
font-size:13px;
font-weight:650;
cursor:pointer;
transition:.35s ease;
}

.navlinks button:hover{
color:white;
transform:translateY(-3px) scale(1.04);
border-color:rgba(255,255,255,.35);
box-shadow:0 12px 34px rgba(255,255,255,.12);
}

.navlinks .explore{
background:white;
color:black;
}

@keyframes menuDrop{
from{opacity:0;transform:translateX(-50%) translateY(-28px) scale(.96)}
to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
}

.hero{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
padding:120px 24px 40px;
z-index:2;
}

.eyebrow{
margin:0 0 14px;
font-size:14px;
letter-spacing:4px;
text-transform:uppercase;
color:rgba(255,255,255,.7);
animation:fadeUp 1s ease both;
}

h1{
margin:0;
max-width:1050px;
font-size:clamp(54px,9vw,132px);
line-height:.88;
letter-spacing:-6px;
font-weight:900;
animation:heroGlow 4s ease-in-out infinite alternate;
}

.sub{
max-width:660px;
margin:28px 0 0;
font-size:clamp(17px,2vw,24px);
line-height:1.4;
color:rgba(255,255,255,.72);
animation:fadeUp 1s ease .3s both;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(26px)}
to{opacity:1;transform:translateY(0)}
}

@keyframes heroGlow{
from{text-shadow:0 0 22px rgba(255,255,255,.16)}
to{text-shadow:0 0 32px rgba(255,255,255,.38),0 0 85px rgba(255,0,150,.25)}
}

.product{
position:fixed;
left:50%;
bottom:8vh;
width:clamp(170px,25vw,330px);
height:clamp(170px,25vw,330px);
transform:translateX(-50%);
border-radius:50%;
z-index:1;
background:
radial-gradient(circle at 35% 25%,rgba(255,255,255,.95),rgba(255,255,255,.18) 26%,rgba(255,0,140,.15) 50%,rgba(0,0,0,.15) 72%);
box-shadow:inset 0 0 50px rgba(255,255,255,.18),0 0 120px rgba(255,0,130,.22);
animation:floatOrb 5s ease-in-out infinite;
}

@keyframes floatOrb{
0%,100%{transform:translateX(-50%) translateY(0)}
50%{transform:translateX(-50%) translateY(-18px)}
}

.stamp{
position:absolute;
top:50%;
left:50%;
width:min(90vw,920px);
padding:34px 20px;
z-index:40;
font-family:"Impact","Arial Black",sans-serif;
font-size:clamp(54px,10vw,140px);
letter-spacing:6px;
line-height:1;
text-align:center;
text-transform:uppercase;
color:#ff1f1f;
border:13px solid #ff1f1f;
border-radius:20px;
text-shadow:2px 2px 0 rgba(0,0,0,.45),0 0 18px rgba(255,0,0,.6);
box-shadow:0 0 0 6px rgba(255,31,31,.28),0 0 48px rgba(255,0,0,.45);
opacity:0;
pointer-events:none;
mix-blend-mode:screen;
transform:translate(-50%,-50%) rotate(-11deg) scale(2.2);
}

.stamp.show{
animation:stampOnce .9s ease-out forwards;
}

.stamp::before{
content:"";
position:absolute;
inset:13px;
border:5px solid #ff1f1f;
border-radius:9px;
opacity:.8;
}

@keyframes stampOnce{
0%{opacity:0;transform:translate(-50%,-50%) rotate(-11deg) scale(2.35);filter:blur(9px)}
55%{opacity:1;transform:translate(-50%,-50%) rotate(-11deg) scale(.9);filter:blur(0)}
75%{transform:translate(-50%,-50%) rotate(-11deg) scale(1.04)}
100%{opacity:.95;transform:translate(-50%,-50%) rotate(-11deg) scale(1)}
}
</style>
</head>

<body>

<nav class="topbar">
<div class="logo">KIMIBRUSH</div>
<div class="navlinks">
<button>Design</button>
<button>Brush Tech</button>
<button>Privacy</button>
<button class="explore" onclick="showComingSoon()">Explore</button>
</div>
</nav>

<section class="hero">
<p class="eyebrow">Introducing KimiBrush</p>
<h1>The interactive hairbrush that knows your hair.</h1>
<p class="sub">Smart feedback. Gentle guidance. A private beauty ritual, redesigned.</p>
<div class="stamp" id="stamp">COMING SOON</div>
</section>

<div class="product"></div>

<script>
const stamp = document.getElementById("stamp");

function showComingSoon(){
stamp.classList.remove("show");
void stamp.offsetWidth;
stamp.classList.add("show");
}

window.addEventListener("load", () => {
setTimeout(showComingSoon, 4000);
});
</script>

</body>
</html>
