<!DOCTYPE html>
<html>
<head>
<title>Jamies Brushes</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Orbitron', sans-serif;
color:white;
text-align:center;
overflow:hidden;
background:black;
}

/* background image */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background-image:url("Kimi.jpeg");
background-size:cover;
background-position:center;
opacity:0.55;
z-index:-2;
}

/* slight dark overlay */
body::after{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.35);
z-index:-1;
}

/* center container */
.center{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

/* animated text */
.flip{
font-size:90px;
color:#00ffcc;
text-shadow:
0 0 10px #00ffcc,
0 0 20px #00ffcc,
0 0 40px #00ffcc;
height:110px;
overflow:hidden;
}

/* word list */
.words{
animation:flipWords 6s infinite;
}

.words div{
height:110px;
}

/* animation */
@keyframes flipWords{
0%{transform:translateY(0)}
33%{transform:translateY(-110px)}
66%{transform:translateY(-220px)}
100%{transform:translateY(0)}
}

/* sparkles */
.sparkle{
position:fixed;
width:6px;
height:6px;
background:#00ffcc;
border-radius:50%;
box-shadow:0 0 10px #00ffcc;
animation:sparkleMove 6s linear infinite;
opacity:0.8;
}

/* sparkle movement */
@keyframes sparkleMove{
0%{
transform:translateY(100vh);
opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateY(-10vh);
opacity:0;
}
}

/* different sparkle positions */
.sparkle:nth-child(1){left:10%;animation-delay:0s;}
.sparkle:nth-child(2){left:25%;animation-delay:1s;}
.sparkle:nth-child(3){left:40%;animation-delay:2s;}
.sparkle:nth-child(4){left:55%;animation-delay:3s;}
.sparkle:nth-child(5){left:70%;animation-delay:4s;}
.sparkle:nth-child(6){left:85%;animation-delay:5s;}

</style>
</head>

<body>

<!-- sparkles -->
<div class="sparkle"></div>
<div class="sparkle"></div>
<div class="sparkle"></div>
<div class="sparkle"></div>
<div class="sparkle"></div>
<div class="sparkle"></div>

<!-- flipping text -->
<div class="center">

<div class="flip">
<div class="words">
<div>Jamie</div>
<div>is</div>
<div>awesome</div>
</div>
</div>

</div>

</body>
</html>
