<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avo Ninja Game</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#dffff5,#fff3c4);
  touch-action:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

#topbar{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:100;
}

.box{
  background:white;
  padding:12px 18px;
  border-radius:25px;
  font-weight:bold;
  box-shadow:0 6px 18px rgba(0,0,0,.15);
}

#back{
  background:#00b894;
  color:white;
  text-decoration:none;
}

.screen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:200;
  background:linear-gradient(135deg,#e9fff9,#fff4d6);
  text-align:center;
  padding:20px;
}

.panel{
  background:white;
  padding:35px;
  border-radius:35px;
  max-width:520px;
  box-shadow:0 15px 40px rgba(0,0,0,.18);
  border:5px solid #d8fff2;
}

h1{
  font-size:42px;
  margin:0 0 10px;
}

p{
  font-size:18px;
  line-height:1.5;
}

button{
  border:none;
  background:#ff8a00;
  color:white;
  padding:16px 30px;
  border-radius:35px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

.hidden{
  display:none;
}

.fruit{
  position:absolute;
  font-size:70px;
  cursor:pointer;
  user-select:none;
  z-index:20;
}

.slice-dot{
  position:fixed;
  width:22px;
  height:22px;
  background:white;
  border-radius:50%;
  pointer-events:none;
  z-index:90;
  box-shadow:0 0 16px #00b894;
  transform:translate(-50%,-50%);
  animation:fade .25s forwards;
}

@keyframes fade{
  to{
    opacity:0;
    transform:translate(-50%,-50%) scale(.2);
  }
}

.sword{
  position:fixed;
  font-size:42px;
  pointer-events:none;
  z-index:95;
  transform:translate(-50%,-50%) rotate(-25deg);
}

.pop{
  position:fixed;
  font-size:30px;
  font-weight:bold;
  color:#00b894;
  z-index:120;
  pointer-events:none;
  animation:pop .8s forwards;
}

@keyframes pop{
  from{
    opacity:1;
    transform:translateY(0) scale(1);
  }
  to{
    opacity:0;
    transform:translateY(-45px) scale(1.4);
  }
}
