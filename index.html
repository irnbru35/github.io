<!DOCTYPE html>
<html>
<head>
<title>Jamies Private Project</title>

<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rubik+Spray+Paint&display=swap" rel="stylesheet">

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
overflow:hidden;
background:black;
font-family:'Archivo Black', Arial, sans-serif;
}

/* background */
body::before{
content:"";
position:fixed;
inset:0;
background-image:url("Kimi.jpeg");
background-size:cover;
background-position:center;
opacity:0.48;
z-index:-3;
}

/* dark overlay */
body::after{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,0.45);
z-index:-2;
}

.scene{
position:fixed;
inset:0;
overflow:hidden;
}

/* stamped mark */
.stamp{
position:absolute;
top:50%;
left:50%;
width:92vw;
padding:35px 20px;

color:#ff1f1f;
border:14px solid #ff1f1f;
border-radius:18px;

font-size:clamp(38px, 8vw, 120px);
text-align:center;
letter-spacing:5px;
line-height:1.05;
text-transform:uppercase;

text-shadow:
2px 2px 0 rgba(0,0,0,0.4),
0 0 12px rgba(255,0,0,0.55);

box-shadow:
0 0 0 6px rgba(255,31,31,0.35),
0 0 35px rgba(255,0,0,0.45);

opacity:0;
mix-blend-mode:screen;

animation:stampLoop 7.5s infinite;
}

/* inner stamp border */
.stamp::before{
content:"";
position:absolute;
inset:14px;
border:5px solid #ff1f1f;
border-radius:8px;
opacity:0.85;
}

/* distressed stamp texture */
.stamp::after{
content:"";
position:absolute;
inset:0;
background:
repeating-linear-gradient(
45deg,
rgba(0,0,0,0.18) 0px,
rgba(0,0,0,0.18) 3px,
transparent 3px,
transparent 9px
);
opacity:0.35;
pointer-events:none;
}

.stamp.one{
animation-delay:0s;
}

.stamp.two{
animation-delay:0.55s;
}

.stamp.three{
animation-delay:1.1s;
}

.stamp.four{
animation-delay:1.65s;
}

@keyframes stampLoop{
0%{
opacity:0;
transform:translate(-50%,-50%) rotate(-14deg) scale(2.2);
filter:blur(8px);
}

5%{
opacity:1;
transform:translate(-50%,-50%) rotate(-14deg) scale(0.92);
filter:blur(0);
}

8%{
transform:translate(-50%,-50%) rotate(-14deg) scale(1.04);
}

12%{
opacity:0.9;
transform:translate(-50%,-50%) rotate(-14deg) scale(1);
}

48%{
opacity:0.9;
}

58%{
opacity:0;
}

100%{
opacity:0;
}
}

.stamp.two{
transform:translate(-50%,-50%) rotate(-8deg);
}

.stamp.three{
transform:translate(-50%,-50%) rotate(-17deg);
}

.stamp.four{
transform:translate(-50%,-50%) rotate(-5deg);
}

/* graffiti */
.graffiti{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
padding:3vw;

font-family:'Rubik Spray Paint', 'Archivo Black', Arial, sans-serif;
font-size:clamp(45px, 10vw, 150px);
line-height:0.95;
text-align:center;
text-transform:uppercase;

color:#fff200;
text-shadow:
4px 4px 0 #ff006e,
-4px -4px 0 #00f5ff,
0 0 18px rgba(255,255,255,0.8),
0 0 40px rgba(255,0,110,0.75);

opacity:0;
clip-path:inset(0 100% 0 0);

animation:sprayLoop 7.5s infinite;
animation-delay:3.2s;
}

.graffiti::after{
content:"";
position:absolute;
inset:-20%;
background:
radial-gradient(circle, rgba(255,255,255,0.35) 1px, transparent 3px),
radial-gradient(circle, rgba(255,0,110,0.32) 1px, transparent 4px),
radial-gradient(circle, rgba(0,245,255,0.25) 1px, transparent 5px);
background-size:28px 28px, 39px 39px, 53px 53px;
opacity:0;
animation:splatterLoop 7.5s infinite;
animation-delay:3.2s;
pointer-events:none;
}

@keyframes sprayLoop{
0%{
opacity:0;
clip-path:inset(0 100% 0 0);
transform:rotate(-6deg) scale(1.08);
}

8%{
opacity:1;
clip-path:inset(0 75% 0 0);
}

18%{
clip-path:inset(0 48% 0 0);
}

28%{
clip-path:inset(0 20% 0 0);
}

38%{
opacity:1;
clip-path:inset(0 0 0 0);
transform:rotate(-6deg) scale(1);
}

62%{
opacity:1;
clip-path:inset(0 0 0 0);
}

82%{
opacity:0;
}

100%{
opacity:0;
}
}

@keyframes splatterLoop{
0%{
opacity:0;
}

15%{
opacity:0.4;
}

45%{
opacity:0.85;
}

75%{
opacity:0.85;
}

100%{
opacity:0;
}
}

@media(max-width:700px){
.stamp{
width:95vw;
border-width:8px;
letter-spacing:2px;
padding:25px 12px;
}

.stamp::before{
inset:9px;
border-width:3px;
}

.graffiti{
font-size:clamp(42px, 15vw, 95px);
}
}
</style>
</head>

<body>

<div class="scene">
<div class="stamp one">JAMIES PRIVATE PROJECT</div>
<div class="stamp two">JAMIES PRIVATE PROJECT</div>
<div class="stamp three">JAMIES PRIVATE PROJECT</div>
<div class="stamp four">JAMIES PRIVATE PROJECT</div>

<div class="graffiti">
MIND YOUR OWN BEESWAX
</div>
</div>

</body>
</html>
