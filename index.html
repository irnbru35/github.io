<body>

  <div class="container">
    
    <img src="kimi.jpeg" alt="Kimi Kirei Logo" class="logo">

    <h1>Kimi Kirei Smart AvoBrush</h1>

    <p class="tagline">
      Join our pre-launch list and be the first to hear about product updates, launch dates and exclusive offers.
    </p>

    <form id="prelaunchForm">
      <input
        type="email"
        id="email"
        placeholder="Enter your email address"
        required
      >
      <button type="submit">Join Pre-Launch List</button>
    </form>

    <div id="message"></div>

  </div>

  <script>
    const form = document.getElementById("prelaunchForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      message.innerHTML = "Thank you for joining our pre-launch list!";
      form.reset();
    });
  </script>

</body>
