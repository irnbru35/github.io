<div id="endPanel" class="panel hidden">
  <div class="box">
    <h1>Continue Avo Slash?</h1>
    <p id="finalScore"></p>

    <p>
      Your free avocado lives have ended. To keep playing, please ask a parent
      or guardian to unlock 5 extra avocado lives for £2.
    </p>

    <p><strong>Parent approval required.</strong></p>

    <input id="name" placeholder="Parent name">
    <input id="email" placeholder="Parent email address">

    <button class="orange" onclick="buyExtras()">
      PARENT UNLOCK: 5 EXTRA LIVES - £2
    </button>

    <button onclick="backHome()">
      BACK TO HOME
    </button>
  </div>
</div>

<script>
function backHome(){
  endPanel.classList.add("hidden");
  startPanel.classList.remove("hidden");
}

function startGame(){
 objects=[];slashes=[];splatters=[];halves=[];
 score=0;
 lives=2;
 combo=0;
 running=true;
 lastSpawn=0;
 lastTime=performance.now();

 scoreEl.textContent=score;
 livesEl.textContent=lives;
 comboEl.textContent=combo;

 startPanel.classList.add("hidden");
 endPanel.classList.add("hidden");

 requestAnimationFrame(loop);
}

function buyExtras(){
 let name=document.getElementById("name").value.trim();
 let email=document.getElementById("email").value.trim();

 if(!name || !email){
   alert("Please enter parent name and parent email.");
   return;
 }

 let url="https://buy.stripe.com/cNi7sM8KxdsP5fX90E4sE01";
 url += "?prefilled_email=" + encodeURIComponent(email);
 url += "&client_reference_id=" + encodeURIComponent(name+" - Parent unlock - Avo Slash score "+score);

 location.href=url;
}
</script>
