<!DOCTYPE html>
<html>
<head>
<title>My Cool Website</title>

<style>

body{
font-family:Arial;
color:white;
text-align:center;
margin:0;
padding:0;
background:black;
}

/* background image */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

background-image:url("Kimi.jpeg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;

opacity:0.5;

z-index:-1;
}

/* glass panel */
.glass{
margin:120px auto;
width:60%;
padding:60px;

background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

border-radius:20px;
border:1px solid rgba(255,255,255,0.2);

box-shadow:0 10px 40px rgba(0,0,0,0.6);
}

h1{
font-size:60px;
color:#00ffcc;
margin-top:0;
}

p{
font-size:22px;
}

button{
padding:15px 30px;
font-size:20px;
background:#00ffcc;
border:none;
border-radius:10px;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:scale(1.05);
background:#00ddb3;
}

</style>
</head>

<body>

<div class="glass">

<h1>My Cool Website</h1>
<p>Welcome to my first website.</p>

<button>Enter</button>

</div>

</body>
</html>
