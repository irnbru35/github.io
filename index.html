<!DOCTYPE html>
<html>
<head>
<title>My Cool Website</title>

<style>

body {
font-family: Arial;
color:white;
text-align:center;
padding:50px;
margin:0;
background:black;
}

/* background image layer */
body::before {
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

background-image:url("kimmikirei.png");
background-size:cover;
background-position:center;

opacity:0.25;   /* controls transparency */

z-index:-1;
}

h1 {
font-size:60px;
color:#00ffcc;
}

p {
font-size:22px;
}

button {
padding:15px 30px;
font-size:20px;
background:#00ffcc;
border:none;
border-radius:10px;
cursor:pointer;
}

</style>
</head>

<body>

<h1>My Cool Website</h1>
<p>Welcome to my first website.</p>

<button>Enter</button>

</body>
</html>
