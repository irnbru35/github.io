<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kimi Kirei Smart AvoBrush</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#dffff5,#fff8dc,#ffffff);
  color:#102033;
  overflow-x:hidden;
}

.bg-fun{
  position:fixed;
  inset:0;
  z-index:-1;
  overflow:hidden;
}

.shape{
  position:absolute;
  font-size:42px;
  opacity:.28;
  animation:float 9s infinite ease-in-out;
}

.shape:nth-child(1){left:8%;top:12%}
.shape:nth-child(2){right:8%;top:20%;animation-delay:1s}
.shape:nth-child(3){left:16%;bottom:12%;animation-delay:2s}
.shape:nth-child(4){right:14%;bottom:14%;animation-delay:3s}
.shape:nth-child(5){left:45%;top:8%;animation-delay:4s}

@keyframes float{
  0%,100%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-30px) rotate(12deg)}
}

header{
  text-align:center;
  padding:35px 18px 20px;
}

.logo-wrap{
  width:165px;
  height:165px;
  margin:auto;
  border-radius:50%;
  overflow:hidden;
  background:#e9fff9;
  box-shadow:0 14px 32px rgba(0,0,0,.14);
}

.logo{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scale(1.18);
  display:block;
}

.badge{
  display:inline-block;
  background:#00b894;
  color:white;
  padding:9px 16px;
  border-radius:30px;
  font-weight:bold;
  margin:12px 4px 0;
  font-size:14px;
}
