<!DOCTYPE html>
<html>
<head>
<title>Jamies Brushes</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:'Orbitron', sans-serif;
color:white;
text-align:center;
overflow:hidden;
background:black;
cursor:crosshair;
}

body::before{
content:"";
position:fixed;
inset:0;
background-image:url("Kimi.jpeg");
background-size:cover;
background-position:center;
opacity:0.48;
z-index:-5;
}

body::after{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 50% 45%, rgba(0,255,204,0.20), transparent 35%),
radial-gradient(circle at 20% 20%, rgba(140,0,255,0.18), transparent 35%),
rgba(0,0,0,0.55);
z-index:-4;
}

/* realistic space layer */
.space{
position:fixed;
inset:0;
z-index:-3;
background:
radial-gradient(circle at 15% 25%, white 0px, transparent 2px),
radial-gradient(circle at 35% 60%, white 0px, transparent 1.5px),
radial-gradient(circle at 55% 35%, white 0px, transparent 2px),
radial-gradient(circle at 75% 70%, white 0px, transparent 1.5px),
radial-gradient(circle at 90% 30%, white 0px, transparent 2px),
radial-gradient(circle at 45% 85%, white 0px, transparent 1.5px),
radial-gradient(circle at 65% 15%, white 0px, transparent 1px);
background-size:260px 260px;
animation:spaceDrift 35s linear infinite;
opacity:0.85;
}

/* soft nebula */
.nebula{
position:fixed;
inset:-20%;
z-index:-2;
background:
radial-gradient(circle at 30% 40%, rgba(0,255,204,0.18), transparent 28%),
radial-gradient(circle at 70% 55%, rgba(140,80,255,0.20), transparent 30%),
radial-gradient(circle at 50% 80%, rgba(255,255,255,0.08), transparent 25%);
filter:blur(35px);
animation:nebulaMove 18s ease-in-out infinite alternate;
}

/* tidy futuristic top bar */
nav{
position:fixed;
top:22px;
left:50%;
transform:translateX(-50%);
z-index:10;
padding:14px 28px;
border:1px solid rgba(0,255,204,0.35);
border-radius:999px;
background:rgba(0,0,0,0.35);
backdrop-filter:blur(14px);
box-shadow:0 0 30px rgba(0,255,204,0.25);
}

nav span{
margin:0 16px;
font-size:13px;
letter-spacing:2px;
color:white;
opacity:0.9;
}

/* centre hero */
.hero{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:min(900px,90%);
padding:55px 30px;
border-radius:34px;
background:linear-gradient(
135deg,
rgba(255,255,255,0.08),
rgba(255,255,255,0.02)
);
border:1px solid rgba(255,255,255,0.18);
backdrop-filter:blur(8px);
box-shadow:
0 0 60px rgba(0,255,204,0.18),
inset 0 0 40px rgba(255,255,255,0.04);
}

.brand{
font-size:16px;
letter-spacing:8px;
color:white;
opacity:0.9;
margin-bottom:28px;
}

.flip{
position:relative;
font-size:92px;
font-weight:800;
height:118px;
overflow:hidden;
color:#00ffcc;
text-shadow:
0 0 10px #00ffcc,
0 0 30px #00ffcc,
0 0 70px rgba(0,255,204,0.8);
animation:pulseGlow 2s infinite alternate;
}

/* magnifying glass sweep */
.flip::after{
content:"";
position:absolute;
top:6px;
left:-140px;
width:115px;
height:115px;
border-radius:50%;
border:3px solid rgba(255,255,255,0.9);
background:
radial-gradient(circle, rgba(255,255,255,0.22), rgba(0,255,204,0.08) 45%, transparent 70%);
box-shadow:
0 0 25px rgba(255,255,255,0.8),
0 0 45px rgba(0,255,204,0.8);
animation:magnifySweep 4s ease-in-out infinite;
pointer-events:none;
}

.flip::before{
content:"";
position:absolute;
top:95px;
left:-42px;
width:58px;
height:7px;
background:rgba(255,255,255,0.9);
border-radius:999px;
transform:rotate(45deg);
box-shadow:0 0 18px white;
animation:handleSweep 4s ease-in-out infinite;
pointer-events:none;
}

.words{
animation:flipWords 6s infinite;
}

.words div{
height:118px;
}

.subtitle{
margin-top:24px;
font-size:18px;
letter-spacing:3px;
opacity:0.95;
text-shadow:0 0 14px #00ffcc;
}

button{
margin-top:32px;
padding:15px 36px;
font-size:16px;
font-family:'Orbitron', sans-serif;
background:rgba(0,255,204,0.12);
color:#00ffcc;
border:1px solid #00ffcc;
border-radius:999px;
cursor:pointer;
box-shadow:0 0 24px rgba(0,255,204,0.5);
transition:0.3s;
}

button:hover{
background:#00ffcc;
color:black;
transform:translateY(-3px) scale(1.05);
box-shadow:0 0 45px #00ffcc;
}

.trail{
position:fixed;
width:12px;
height:12px;
background:#00ffcc;
border-radius:50%;
pointer-events:none;
box-shadow:0 0 22px #00ffcc;
animation:trailFade 0.6s linear forwards;
z-index:99;
}

@keyframes flipWords{
0%{transform:translateY(0);}
25%{transform:translateY(0);}
35%{transform:translateY(-118px);}
58%{transform:translateY(-118px);}
68%{transform:translateY(-236px);}
90%{transform:translateY(-236px);}
100%{transform:translateY(0);}
}

@keyframes magnifySweep{
0%{left:-140px; transform:scale(0.9);}
45%{left:50%; transform:translateX(-50%) scale(1.15);}
100%{left:105%; transform:scale(0.9);}
}

@keyframes handleSweep{
0%{left:-42px;}
45%{left:calc(50% + 45px);}
100%{left:calc(105% + 45px);}
}

@keyframes spaceDrift{
from{background-position:0 0;}
to{background-position:520px -520px;}
}

@keyframes nebulaMove{
from{transform:translate(-2%, -2%) scale(1);}
to{transform:translate(2%, 2%) scale(1.08);}
}

@keyframes pulseGlow{
from{
text-shadow:0 0 12px #00ffcc,0 0 30px #00ffcc;
}
to{
text-shadow:0 0 24px #00ffcc,0 0 60px #00ffcc,0 0 100px #00ffcc;
}
}

@keyframes trailFade{
from{opacity:1;transform:scale(1);}
to{opacity:0;transform:scale(0);}
}

@media(max-width:700px){
nav{
width:90%;
padding:12px;
}

nav span{
display:block;
margin:8px 0;
}

.hero{
padding:42px 22px;
}

.flip{
font-size:48px;
height:70px;
}

.words div{
height:70px;
}

@keyframes flipWords{
0%{transform:translateY(0);}
25%{transform:translateY(0);}
35%{transform:translateY(-70px);}
58%{transform:translateY(-70px);}
68%{transform:translateY(-140px);}
90%{transform:translateY(-140px);}
100%{transform:translateY(0);}
}

.flip::after{
width:70px;
height:70px;
}

.flip::before{
top:60px;
width:38px;
}

.brand{
font-size:12px;
letter-spacing:4px;
}
}
</style>
</head>

<body>

<div class="space"></div>
<div class="nebula"></div>

<nav>
<span>JAMIES BRUSHES</span>
<span>FUTURE STYLE</span>
<span>SMOOTH ENERGY</span>
</nav>

<div class="hero">
<div class="brand">SMART BRUSH COLLECTION</div>

<div class="flip">
<div class="words">
<div>Jamie</div>
<div>is</div>
<div>awesome</div>
</div>
</div>

<div class="subtitle">futuristic • tidy • sweet • glowing</div>

<button onclick="makeMagic()">Make Magic ✨</button>
</div>

<audio id="magicSound">
<source src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg" type="audio/ogg">
</audio>

<script>
function makeMagic(){
const sound = document.getElementById("magicSound");
sound.currentTime = 0;
sound.play();
}

document.addEventListener("mousemove", function(e){
const trail = document.createElement("div");
trail.className = "trail";
trail.style.left = e.clientX + "px";
trail.style.top = e.clientY + "px";
document.body.appendChild(trail);

setTimeout(function(){
trail.remove();
}, 600);
});
</script>

</body>
</html>
