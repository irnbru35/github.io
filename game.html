<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avocado Slice Game</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#dffff5,#fff4d6);
  touch-action:none;
  user-select:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

#hud{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:50;
}

.hud-box{
  background:white;
  padding:12px 16px;
  border-radius:25px;
  font-weight:bold;
  box-shadow:0 6px 16px rgba(0,0,0,.15);
}

#back{
  background:#00b894;
  color:white;
  text-decoration:none;
}

.screen{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#e9fff9,#fff4d6);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  z-index:100;
  padding:20px;
}

.panel{
  background:white;
  padding:35px;
  border-radius:35px;
  max-width:520px;
  border:5px solid #d8fff2;
  box-shadow:0 15px 40px rgba(0,0,0,.18);
}

h1{
  font-size:42px;
  margin:0 0 10px;
}

p{
  font-size:18px;
  line-height:1.5;
}

button{
  background:#ff8a00;
  color:white;
  border:0;
  padding:16px 30px;
  border-radius:35px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

button.green{
  background:#00b894;
}

.hidden{
  display:none;
}

.fruit{
  position:absolute;
  font-size:72px;
  z-index:10;
  cursor:pointer;
  will-change:transform;
}

.sword{
  position:fixed;
  font-size:45px;
  z-index:60;
  pointer-events:none;
  transform:translate(-50%,-50%) rotate(-25deg);
}

.slash{
  position:fixed;
  width:28px;
  height:28px;
  border-radius:50%;
  background:white;
  box-shadow:0 0 18px #00b894;
  pointer-events:none;
  z-index:55;
  transform:translate(-50%,-50%);
  animation:fade .25s forwards;
}

@keyframes fade{
  to{
    opacity:0;
    transform:translate(-50%,-50%) scale(.2);
  }
}

.pop{
  position:fixed;
  font-size:30px;
  font-weight:bold;
  color:#00b894;
  z-index:70;
  pointer-events:none;
  animation:pop .8s forwards;
}

@keyframes pop{
  from{opacity:1;transform:translateY(0) scale(1)}
  to{opacity:0;transform:translateY(-45px) scale(1.4)}
}

.reward{
  position:fixed;
  top:22%;
  left:50%;
  transform:translateX(-50%);
  background:#fff4d6;
  border:4px dashed #ff8a00;
  padding:16px 24px;
  border-radius:25px;
  font-size:24px;
  font-weight:bold;
  z-index:80;
  animation:reward .9s forwards;
}

@keyframes reward{
  0%{opacity:0;transform:translateX(-50%) scale(.6)}
  35%{opacity:1;transform:translateX(-50%) scale(1.1)}
  100%{opacity:0;transform:translateX(-50%) scale(1)}
}

@media(max-width:700px){
  h1{font-size:32px}
  .fruit{font-size:60px}
  .hud-box{font-size:14px;padding:10px 12px}
}
</style>
</head>

<body>

<div id="game">

  <div id="hud">
    <div class="hud-box" id="score">Score: 0</div>
    <div class="hud-box" id="lives">Lives: ❤️❤️❤️</div>
    <a class="hud-box" id="back" href="index.html">Back</a>
  </div>

  <div id="start" class="screen">
    <div class="panel">
      <h1>🥑 Avocado Slice!</h1>
      <p>Slice the flying avocados like Fruit Ninja. Hit stars for bonus points. Avoid bombs.</p>
      <p><strong>Use your mouse or finger as the sword.</strong></p>
      <button onclick="startGame()">Start Game</button>
    </div>
  </div>

  <div id="over" class="screen hidden">
    <div class="panel">
      <h1>Game Over 🥑</h1>
      <p id="finalScore"></p>
      <button onclick="restartGame()">Play Again</button>
      <br><br>
      <button class="green" onclick="window.location.href='index.html'">Back to Website</button>
    </div>
  </div>

</div>

<script>
const game = document.getElementById("game");
const scoreBox = document.getElementById("score");
const livesBox = document.getElementById("lives");
const startScreen = document.getElementById("start");
const overScreen = document.getElementById("over");
const finalScore = document.getElementById("finalScore");

let score = 0;
let lives = 3;
let running = false;
let fruits = [];
let spawnInterval;
let animationFrame;
let sword;

function startGame(){
  score = 0;
  lives = 3;
  running = true;
  fruits = [];
  updateHud();

  startScreen.classList.add("hidden");
  overScreen.classList.add("hidden");

  document.querySelectorAll(".fruit,.slash,.pop,.reward,.sword").forEach(el => el.remove());

  sword = document.createElement("div");
  sword.className = "sword";
  sword.innerHTML = "⚔️";
  document.body.appendChild(sword);

  spawnInterval = setInterval(spawnFruit, 700);
  animationFrame = requestAnimationFrame(updateGame);
}

function restartGame(){
  clearInterval(spawnInterval);
  cancelAnimationFrame(animationFrame);
  startGame();
}

function updateHud(){
  scoreBox.innerHTML = "Score: " + score;
  livesBox.innerHTML = "Lives: " + "❤️".repeat(lives);
}

function spawnFruit(){
  if(!running) return;

  const el = document.createElement("div");
  el.className = "fruit";

  const r = Math.random();
  let type = "avo";

  if(r > 0.88){
    type = "bomb";
    el.innerHTML = "💣";
  }else if(r > 0.76){
    type = "star";
    el.innerHTML = "⭐";
  }else{
    type = "avo";
    el.innerHTML = "🥑";
  }

  const x = Math.random() * (window.innerWidth - 100) + 30;
  const y = window.innerHeight + 80;
  const vx = (Math.random() - 0.5) * 3;
  const vy = -(14 + Math.random() * 7);

  const fruit = {
    el:el,
    type:type,
    x:x,
    y:y,
    vx:vx,
    vy:vy,
    gravity:0.28,
    sliced:false,
    rotation:0
  };

  fruits.push(fruit);
  game.appendChild(el);
}

function updateGame(){
  if(!running) return;

  for(let i = fruits.length - 1; i >= 0; i--){
    const f = fruits[i];

    f.x += f.vx;
    f.y += f.vy;
    f.vy += f.gravity;
    f.rotation += 5;

    f.el.style.left = f.x + "px";
    f.el.style.top = f.y + "px";
    f.el.style.transform = "rotate(" + f.rotation + "deg)";

    if(f.y > window.innerHeight + 120){
      if(!f.sliced && f.type !== "bomb"){
        loseLife();
      }

      f.el.remove();
      fruits.splice(i,1);
    }
  }

  animationFrame = requestAnimationFrame(updateGame);
}

function checkSlice(x,y){
  if(!running) return;

  if(sword){
    sword.style.left = x + "px";
    sword.style.top = y + "px";
  }

  createSlash(x,y);

  for(let i = fruits.length - 1; i >= 0; i--){
    const f = fruits[i];
    if(f.sliced) continue;

    const rect = f.el.getBoundingClientRect();

    if(x > rect.left && x < rect.right && y > rect.top && y < rect.bottom){
      sliceFruit(f,i);
    }
  }
}

function sliceFruit(f,index){
  f.sliced = true;

  const rect = f.el.getBoundingClientRect();
  const x = rect.left + rect.width / 2;
  const y = rect.top + rect.height / 2;

  if(f.type === "avo"){
    score += 10;
    showPop("+10 🥑",x,y);
  }

  if(f.type === "star"){
    score += 30;
    showPop("+30 ⭐",x,y);
    showReward("SUPER SLICE! ⭐");
  }

  if(f.type === "bomb"){
    showPop("BOOM! 💥",x,y);
    loseLife();
  }

  f.el.innerHTML = f.type === "bomb" ? "💥" : "✨";
  updateHud();

  setTimeout(() => {
    if(f.el.parentElement) f.el.remove();
  },120);

  fruits.splice(index,1);

  if(score > 0 && score % 100 === 0){
    showReward("Reward unlocked! 🎉");
  }
}

function loseLife(){
  lives--;
  updateHud();

  if(lives <= 0){
    endGame();
  }
}

function endGame(){
  running = false;
  clearInterval(spawnInterval);
  cancelAnimationFrame(animationFrame);

  document.querySelectorAll(".fruit").forEach(el => el.remove());
  if(sword) sword.remove();

  finalScore.innerHTML = "Your score was <strong>" + score + "</strong>";
  overScreen.classList.remove("hidden");
}

function createSlash(x,y){
  const dot = document.createElement("div");
  dot.className = "slash";
  dot.style.left = x + "px";
  dot.style.top = y + "px";
  document.body.appendChild(dot);
  setTimeout(() => dot.remove(),250);
}

function showPop(text,x,y){
  const pop = document.createElement("div");
  pop.className = "pop";
  pop.innerHTML = text;
  pop.style.left = x + "px";
  pop.style.top = y + "px";
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(),800);
}

function showReward(text){
  const reward = document.createElement("div");
  reward.className = "reward";
  reward.innerHTML = text;
  document.body.appendChild(reward);
  setTimeout(() => reward.remove(),900);
}

document.addEventListener("mousemove", function(e){
  checkSlice(e.clientX,e.clientY);
});

document.addEventListener("touchmove", function(e){
  if(e.touches.length > 0){
    checkSlice(e.touches[0].clientX,e.touches[0].clientY);
  }
},{passive:false});

document.addEventListener("touchstart", function(e){
  if(e.touches.length > 0){
    checkSlice(e.touches[0].clientX,e.touches[0].clientY);
  }
},{passive:false});
</script>

</body>
</html>
